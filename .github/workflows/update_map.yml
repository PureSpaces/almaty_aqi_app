name: Hourly Air Quality Map Update & Deploy

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at minute 0 of every hour
  workflow_dispatch:      # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas folium requests flask numpy

      - name: Execute Map Generator
        env:
          AAI_API_KEY: ${{ secrets.AAI_API_KEY }}
        run: |
          python app.py

      - name: Commit Updated CSVs and index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage generated files
          git add index.html
          if [ -f "almaty_pm25_data.csv" ]; then git add almaty_pm25_data.csv; fi
          if [ -f "factory_pm25_predictions.csv" ]; then git add factory_pm25_predictions.csv; fi
          
          # Commit changes if files were updated ([skip ci] prevents infinite build loops)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update PM2.5 data [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
